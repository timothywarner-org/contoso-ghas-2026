# Docker Compose file for Contoso Robot Fleet Security
# Note: If using Windows, run this from your WSL2 terminal with the run-docker.sh script
# Run: ./scripts/run-docker.sh

services:
  app:
    build: .
    container_name: contoso-robot-fleet
    ports:
      - "30000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/contoso-robots
      - REDIS_URL=redis://redis:6379
      - MQTT_BROKER_URL=mqtt://mqtt:1883
      - JWT_SECRET=contoso-robot-fleet-secret-2024
    depends_on:
      - mongo
      - redis
      - mqtt
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./data:/app/data
    networks:
      - contoso-network

  mongo:
    image: mongo:6.0
    container_name: contoso-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=contoso2024
      - MONGO_INITDB_DATABASE=contoso-robots
    volumes:
      - mongo-data:/data/db
    networks:
      - contoso-network

  redis:
    image: redis:7-alpine
    container_name: contoso-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - contoso-network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: contoso-mqtt
    ports:
      - "18830:1883"
      - "19001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    networks:
      - contoso-network

  # Optional: MongoDB Express for database management
  mongo-express:
    image: mongo-express:latest
    container_name: contoso-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=contoso2024
      - ME_CONFIG_MONGODB_URL=mongodb://admin:contoso2024@mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin123
    depends_on:
      - mongo
    networks:
      - contoso-network

volumes:
  mongo-data:
  redis-data:
  mqtt-data:
  mqtt-logs:

networks:
  contoso-network:
    driver: bridge